<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past Clients — 11Eleven Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .brands-section {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 32px 72px;
    }

    .brands-image-wrap {
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .brands-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius);
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .brands-section {
        padding: 0 16px 48px;
      }
    }
  </style>
</head>
<body>

  <h1 class="page-title reveal">PAST CLIENTS</h1>

  <div class="brands-section reveal">
    <div class="brands-image-wrap">
      <img src="brands.png" alt="Our Past Clients & Brands" />
    </div>
  </div>

  <div style="text-align:center; padding: 8px 32px 72px;">
    <p style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:20px;">Want to join the list?</p>
    <a href="contact.html" class="btn btn-solid">Work With Us</a>
  </div>

  <script src="shared.js"></script>
  <script src="main.js"></script>
</body>
</html>
