<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Work — 11Eleven Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .video-section {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 32px 56px;
    }
    .video-section-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .video-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .video-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--pink-mid);
      aspect-ratio: 9/16;
      cursor: pointer;
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* Force thumbnail to render on mobile */
      -webkit-playsinline: true;
    }
    .video-card .play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.20);
      transition: background 0.2s;
    }
    .video-card .play-btn svg {
      width: 44px;
      height: 44px;
      fill: white;
      opacity: 0.92;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
      transition: transform 0.2s, opacity 0.2s;
    }
    .video-card:hover .play-btn { background: rgba(0,0,0,0.06); }
    .video-card:hover .play-btn svg { transform: scale(1.12); opacity: 1; }

    .row-divider {
      border: none;
      border-top: 1px solid rgba(0,0,0,.08);
      max-width: var(--max-w);
      margin: 0 auto 48px;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      position: relative;
      max-height: 90vh;
      max-width: 420px;
      width: 92vw;
    }
    .lightbox-inner video {
      width: 100%;
      height: auto;
      max-height: 88vh;
      border-radius: 12px;
      display: block;
    }
    .lightbox-close {
      position: absolute;
      top: -44px;
      right: 0;
      background: none;
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      line-height: 1;
      padding: 8px;
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .video-section { padding: 0 14px 44px; }
      .video-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .video-card .play-btn svg { width: 36px; height: 36px; }
      .row-divider { margin: 0 14px 40px; }
    }
  </style>
</head>

  <!-- Lightbox -->
  <div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9999;align-items:center;justify-content:center;" onclick="closeLightbox(event)">
    <div style="position:relative;max-height:90vh;max-width:420px;width:92vw;">
      <button onclick="closeLightbox()" style="position:absolute;top:-44px;right:0;background:none;border:none;color:white;font-size:30px;cursor:pointer;padding:8px;">&#x2715;</button>
      <video id="lightboxVideo" controls playsinline style="width:100%;height:auto;max-height:88vh;border-radius:12px;display:block;"></video>

  <div style="text-align:center;padding:0 32px 80px;">

  </div>

  <script src="shared.js"></script>
  <script src="main.js"></script>
  <script>
    // Force thumbnail generation on iOS/Android
    document.querySelectorAll('.video-card video').forEach(v => {
      v.load();
      v.addEventListener('loadedmetadata', () => { v.currentTime = 0.1; });
    });

    function openLightbox(card) {
      const video = card.querySelector('video');
      // Only open if the video has actually loaded data
      if (video.readyState < 1) return;
      const lbVideo = document.getElementById('lightboxVideo');
      lbVideo.src = video.src;
      const lb = document.getElementById('lightbox'); lb.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      lbVideo.play().catch(() => {});
    }

    // Attach clicks only after DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.video-card, .index-video-card').forEach(card => {
        card.addEventListener('click', () => openLightbox(card));
      });
    });
    function closeLightbox(e) {
      if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lightbox-close')) return;
      const lbVideo = document.getElementById('lightboxVideo');
      lbVideo.pause();
      lbVideo.src = '';
      document.getElementById('lightbox').style.display = 'none';
      document.body.style.overflow = '';
    }
  </script>
